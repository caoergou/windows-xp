name: Bootstrap scenario tools on npm

on:
  workflow_dispatch:

concurrency:
  group: npm-bootstrap-scenario-tools
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci
      - run: npm run typecheck --workspace @caoergou/xp-scenario-tools
      - run: npm run scenario:build

      - name: Pack release artifacts
        run: |
          mkdir -p release-artifacts
          npm pack @caoergou/windows-xp@0.4.0 --ignore-scripts --pack-destination release-artifacts
          npm pack --workspace @caoergou/xp-scenario-tools --ignore-scripts --pack-destination release-artifacts

      - name: Verify the package in a clean consumer
        run: npm run scenario:consumer-smoke -- ./release-artifacts/caoergou-windows-xp-0.4.0.tgz ./release-artifacts/caoergou-xp-scenario-tools-0.1.0.tgz

      # Trusted publishing cannot be configured until this package exists.
      # Use the repository's token exactly once to create the public package;
      # all later releases must use OIDC through publish.yml.
      - name: Publish initial scenario tools package
        run: |
          if npm view "@caoergou/xp-scenario-tools@0.1.0" version >/dev/null 2>&1; then
            echo "@caoergou/xp-scenario-tools@0.1.0 already exists; skipping"
          else
            npm publish ./release-artifacts/caoergou-xp-scenario-tools-0.1.0.tgz --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
